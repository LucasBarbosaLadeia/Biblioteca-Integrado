events {}

http {
    server {
        listen 80;
        server_name localhost;

        # Backend principal
        location /api/ {
            proxy_pass http://backend:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Microserviço de empréstimos
        location /emprestimos/ {
            proxy_pass http://emprestimos:3002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
