events {}

http {
    server {
        listen 80;
        server_name localhost;

        # Backend principal (also expose via /api/ for frontend compatibility)
        location /backend/ {
            proxy_pass http://backend:3001/;
            # Forward useful headers to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Improve proxy behavior for keepalive / websockets
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Increase timeouts / body size if clients upload files
            proxy_read_timeout 90s;
            client_max_body_size 10M;
        }

        # Microserviço de empréstimos
        location /emprestimos/ {
            proxy_pass http://emprestimos:3002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Reservas do microserviço de empréstimos
        location /reservas/ {
            proxy_pass http://emprestimos:3002/reservas/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /reservas {
            proxy_pass http://emprestimos:3002/reservas;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Fila de notificações (DEVE vir ANTES de /notification/)
        location /notification/fila/ {
            proxy_pass http://notification:3005/fila/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Notification
        location /notification/ {
            proxy_pass http://notification:3005/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Proxy root to backend so backend routes are available without '/api' prefix
        # Este DEVE ficar por ÚLTIMO para não sobrescrever as rotas específicas acima
        location / {
            proxy_pass http://backend:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 90s;
            client_max_body_size 10M;
        }
    }
}
