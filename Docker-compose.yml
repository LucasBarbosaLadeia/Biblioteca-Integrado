version: "3.9"

services:
  # =========================
  # Banco de Dados MySQL
  # =========================
  database:
    image: mysql:8.0
    container_name: mysql-container
    env_file:
      - ./back/.env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  # =========================
  # Backend Node.js
  # =========================
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./back/.env
    depends_on:
      - database
    ports:
      - "3001:3001"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # Banco de Dados PostgreSQL (microserviço)
  # =========================
  postgres_emprestimos:
    image: postgres:16
    container_name: postgres-emprestimos
    env_file:
      - ./Microservicos/emprestimos/.env
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-net

  # =========================
  # Microserviço Empréstimos
  # =========================
  emprestimos:
    build:
      context: ./Microservicos/emprestimos
      dockerfile: Dockerfile
    container_name: emprestimos-service
    env_file:
      - ./Microservicos/emprestimos/.env
    depends_on:
      - postgres_emprestimos
    ports:
      - "3002:3002"
    networks:
      - app-net

  # =========================
  # Nginx
  # =========================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-container
    ports:
      - "80:80"
    depends_on:
      - backend
      - emprestimos
    networks:
      - app-net

# =========================
# Volumes e redes
# =========================
volumes:
  db_data:
  pg_data:

networks:
  app-net:
    driver: bridge
